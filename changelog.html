<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once in the UA - Changelog</title>
    <style>
        body {
            font-family: 'Helvetica', Arial, sans-serif;
            margin: 2em;
            line-height: 1.6;
            max-width: 800px;
            margin: 2em auto;
        }
        h1 { 
            border-bottom: 2px solid #eee; 
            padding-bottom: 0.5em; 
        }
        h2 { 
            border-bottom: 1px solid #eee; 
            padding-bottom: 0.3em; 
            margin-top: 2em; 
        }
        .changelog-version {
            font-weight: bold;
            font-size: 1.1em;
        }
        .changelog-date {
            color: #666;
        }
        .changelog-section {
            margin: 1em 0;
        }
        .changelog-section h3 {
            margin-bottom: 0.5em;
        }
        .changelog-section ul {
            margin-left: 1em;
            padding-left: 1em;
        }
        .changelog-section li {
            margin-bottom: 0.5em;
        }
        a { 
            color: #0066cc; 
        }
        code { 
            background: #f5f5f5; 
            padding: 0.2em 0.4em; 
            border-radius: 3px; 
        }
        #loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        #error {
            background: #ffe0e0;
            border: 1px solid #ffcccc;
            padding: 15px;
            border-radius: 4px;
            color: #c00;
        }
    </style>
</head>
<body>
    <p>
        <a href="index.html" style="display: inline-block; padding: 0.5em 1em; background: #f5f5f5; border-radius: 4px; text-decoration: none; color: #333;">
            ← Back to Once in the UA
        </a>
    </p>

    <h1>Changelog</h1>
    
    <div id="loading">Loading changelog...</div>
    <div id="error" style="display: none;"></div>
    <div id="changelog-content"></div>

    <script>
        // Use marked.js from CDN for markdown parsing
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
        script.onload = function() {
            loadChangelog();
        };
        script.onerror = function() {
            showError('Failed to load markdown parser. Please refresh the page.');
        };
        document.head.appendChild(script);

        function loadChangelog() {
            fetch('CHANGELOG.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Changelog not found');
                    }
                    return response.text();
                })
                .then(markdown => {
                    document.getElementById('loading').style.display = 'none';
                    
                    // Parse markdown to HTML
                    const html = marked.parse(markdown);
                    document.getElementById('changelog-content').innerHTML = html;
                })
                .catch(error => {
                    showError('Changelog not found: ' + error.message);
                });
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
