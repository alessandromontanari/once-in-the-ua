name: Update DeepState Map Data

on:
  schedule:
    # Run every day at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This grants write permissions to the GITHUB_TOKEN
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run download script
        run: |
          python src/download-geojson.py
          
      - name: Wait for file synchronization
        run: |
          # Ensure enemy_positions_latest.json is fully written and accessible
          sleep 10
          
      - name: Run classification script
        run: |
          python src/classify_enemy_units.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add data/geojson-invasion/ data/enemy_positions/ js/deepstatemap_data_latest.js
            git commit -m "Automated update: DeepState map data [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
